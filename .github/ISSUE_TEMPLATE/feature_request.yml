name: Feature request
description: An idea for something Netspeeder could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or getting in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Netspeeder help?
      description: Your idea of the solution, if you have one.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md).
